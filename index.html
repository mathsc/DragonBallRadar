<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05100a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dragon Radar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage">
  <div id="radar">
    <canvas id="scope" aria-label="Radar. Tap a target for details."></canvas>
    <img id="frame" src="assets/frame.png" alt="">
  </div>
</main>

<footer id="hud">
  <button id="zoom" type="button" aria-live="polite">AUTO</button>
  <div id="hud-target">&mdash;</div>
  <div id="hud-status">Waiting for GPS&hellip;</div>
</footer>

<!-- Target details, opened by tapping a dot. -->
<div id="sheet" hidden>
  <div id="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
    <h2 id="sheet-name"></h2>
    <p id="sheet-desc"></p>
    <div id="sheet-meta"></div>
    <button id="sheet-close" type="button">Close</button>
  </div>
</div>

<script src="radar.js"></script>
</body>
</html>
